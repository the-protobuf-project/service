version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/" # examples/ resolves runtime-go through CI's sibling checkout
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directories:
      - "/examples/rust"
      - "/examples/rust-store"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
