[package]
name = "service-rust-store-examples"
version = "0.1.0"
edition = "2024"
publish = false

# store=true and cache=true: the generated servers persist through runtime-rs's
# database::repository::Repository, and the app shell opens the records
# database (SQLite here, rust_database=sqlite) and the cache.
#
# runtime-rs at main, as every consumer uses it (Cargo.lock records the commit):
# RecordsRepository and database::repository::cached, which protoc-gen-cache's
# output needs, landed in runtime-rs#49.
[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
tonic-types = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde", "derive"] }
futures-core = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
config = { package = "tpp-config", git = "https://github.com/the-protobuf-project/runtime-rs", branch = "main" }
grpc = { package = "tpp-grpc", git = "https://github.com/the-protobuf-project/runtime-rs", branch = "main", default-features = false, features = ["tls", "servicex-store"] }
database = { package = "tpp-database", git = "https://github.com/the-protobuf-project/runtime-rs", branch = "main", default-features = false, features = ["orm-sqlite", "cached"] }
cache = { package = "tpp-cache", git = "https://github.com/the-protobuf-project/runtime-rs", branch = "main" }

[build-dependencies]
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
