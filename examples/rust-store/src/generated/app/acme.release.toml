# service — https:#github.com/the-protobuf-project/service

# Production configuration for acme: production-safe, non-secret topology,
# compiled into the binary. Secrets stay blank here and come from ACME_
# environment variables at deploy time.

[app]
name = "acme"
version = "v0.1.0"
description = "Acme"

[server]
# development, debug, staging or production.
environment = "production"
enable_http = true
enable_health = true
enable_mcp = true
experimental_http3 = false
# How long a stop waits for in-flight requests; 0 = the runtime's default.
shutdown_timeout_seconds = 20

[server.grpc]
host = "0.0.0.0"
port = 50051

[server.http]
host = "0.0.0.0"
port = 8080

[server.mcp]
host = "0.0.0.0"
port = 8081
# stdio, streamable-http or sse.
transport = "streamable-http"
path = "/mcp"
stateless = true

[server.cors]
enabled = false
allowed_origins = []
max_age_seconds = 600

[server.tls]
cert_file = ""
key_file = ""

[database]
# Secret: set ACME_DATABASE__URL at deploy time.
url = ""
max_connections = 10

[cache]
enabled = false
backend = "redis"
address = "localhost:6379"
prefix = "acme"
database = ""

# Workers KV, when cache.backend = "workerskv". Secret: set ACME_CACHE__WORKERSKV__API_TOKEN at deploy time.
[cache.workerskv]
account_id = ""
namespace_id = ""
api_token = ""
