# Telemetry configuration for acme.
#
# Embedded in the binary; holds defaults. What varies per deployment -- the
# OTLP collector endpoint, the environment, the site labels -- comes from
# ACME_ environment variables (see telemetry.go), so one binary serves
# every deployment without a rebuild.

[service]
name = "acme"
version = "0.1.0"
environment = "development"
description = "Acme"

[telemetry]
enabled = true

# The OpenTelemetry collector. In deployment set ACME_OTLP_ENDPOINT=host:port.
[telemetry.otlp]
enabled = true
endpoint = "localhost:6009"
use_http = true

[telemetry.metrics]
export_interval_seconds = 5

[tracing]
enabled = true

[logging.log]
report_caller = true
report_timestamp = true
caller_offset = 1
