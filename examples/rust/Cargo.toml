[package]
name = "service-rust-examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
tonic-types = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
futures-core = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# The application shell (src/generated/app): runtime-rs's configuration loader
# and hybrid gRPC/REST/MCP server, pinned to the commit that merged tpp-config
# (runtime-rs#43) until runtime-rs is released.
config = { package = "tpp-config", git = "https://github.com/the-protobuf-project/runtime-rs", rev = "f2ca844" }
grpc = { package = "tpp-grpc", git = "https://github.com/the-protobuf-project/runtime-rs", rev = "f2ca844", default-features = false, features = ["tls"] }

[build-dependencies]
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
