[package]
name = "service-rust-examples"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
tonic-types = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
futures-core = "0.3"
serde_json = "1"

[build-dependencies]
prost = "0.14"
prost-types = "0.14"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
