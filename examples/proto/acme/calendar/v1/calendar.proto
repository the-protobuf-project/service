// Calendars and the events on them, after RFC 5545: a nested resource
// (calendars/{calendar}/events/{event}) and custom methods beside the
// standard ones, which the generated servers leave to the consumer.

syntax = "proto3";

package acme.calendar.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "service/v1/annotations.proto";

option go_package = "github.com/the-protobuf-project/service/examples/generated/go/acme/calendar/v1;calendarv1";
option java_multiple_files = true;
option java_outer_classname = "CalendarProto";
option java_package = "com.acme.calendar.v1";

// Calendars serves calendars.
service Calendars {
  option (google.api.default_host) = "calendar.acme.example";

  // Gets a calendar.
  rpc GetCalendar(GetCalendarRequest) returns (Calendar) {
    option (google.api.http) = {get: "/v1/{name=calendars/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists calendars.
  rpc ListCalendars(ListCalendarsRequest) returns (ListCalendarsResponse) {
    option (google.api.http) = {get: "/v1/calendars"};
  }

  // Creates a calendar.
  rpc CreateCalendar(CreateCalendarRequest) returns (Calendar) {
    option (google.api.http) = {
      post: "/v1/calendars"
      body: "calendar"
    };
    option (google.api.method_signature) = "calendar,calendar_id";
  }

  // Updates a calendar.
  rpc UpdateCalendar(UpdateCalendarRequest) returns (Calendar) {
    option (google.api.http) = {
      patch: "/v1/{calendar.name=calendars/*}"
      body: "calendar"
    };
    option (google.api.method_signature) = "calendar,update_mask";
  }

  // Deletes a calendar; force deletes its events with it.
  rpc DeleteCalendar(DeleteCalendarRequest) returns (Calendar) {
    option (google.api.http) = {delete: "/v1/{name=calendars/*}"};
    option (google.api.method_signature) = "name";
  }

  // Undeletes a calendar.
  rpc UndeleteCalendar(UndeleteCalendarRequest) returns (Calendar) {
    option (google.api.http) = {
      post: "/v1/{name=calendars/*}:undelete"
      body: "*"
    };
  }

  // Reports how busy a calendar is (custom, AIP-136).
  rpc QueryFreeBusy(QueryFreeBusyRequest) returns (QueryFreeBusyResponse) {
    option (google.api.http) = {get: "/v1/{name=calendars/*}:queryFreeBusy"};
  }
}

// Events serves the events on calendars.
service Events {
  option (google.api.default_host) = "calendar.acme.example";

  // Gets an event.
  rpc GetEvent(GetEventRequest) returns (Event) {
    option (google.api.http) = {get: "/v1/{name=calendars/*/events/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a calendar's events.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (google.api.http) = {get: "/v1/{parent=calendars/*}/events"};
    option (google.api.method_signature) = "parent";
  }

  // Creates an event.
  rpc CreateEvent(CreateEventRequest) returns (Event) {
    option (google.api.http) = {
      post: "/v1/{parent=calendars/*}/events"
      body: "event"
    };
    option (google.api.method_signature) = "parent,event,event_id";
  }

  // Updates an event.
  rpc UpdateEvent(UpdateEventRequest) returns (Event) {
    option (google.api.http) = {
      patch: "/v1/{event.name=calendars/*/events/*}"
      body: "event"
    };
    option (google.api.method_signature) = "event,update_mask";
  }

  // Deletes an event.
  rpc DeleteEvent(DeleteEventRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1/{name=calendars/*/events/*}"};
    option (google.api.method_signature) = "name";
  }

  // Undeletes an event.
  rpc UndeleteEvent(UndeleteEventRequest) returns (Event) {
    option (google.api.http) = {
      post: "/v1/{name=calendars/*/events/*}:undelete"
      body: "*"
    };
  }

  // Lists a recurring event's instances (custom, AIP-136).
  rpc ExpandEvent(ExpandEventRequest) returns (ExpandEventResponse) {
    option (google.api.http) = {get: "/v1/{name=calendars/*/events/*}:expand"};
  }
}

// A calendar.
message Calendar {
  option (google.api.resource) = {
    type: "calendar.acme.example/Calendar"
    pattern: "calendars/{calendar}"
    singular: "calendar"
    plural: "calendars"
  };

  // The resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // What the calendar is called.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // The IANA time zone.
  string time_zone = 3 [(google.api.field_behavior) = OPTIONAL];

  // When it was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it last changed.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The concurrency token.
  string etag = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was deleted (AIP-164).
  google.protobuf.Timestamp delete_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it goes for good (AIP-164).
  google.protobuf.Timestamp purge_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// An event on a calendar.
message Event {
  option (google.api.resource) = {
    type: "calendar.acme.example/Event"
    pattern: "calendars/{calendar}/events/{event}"
    singular: "event"
    plural: "events"
  };
  option (service.v1.event) = {
    type: "example.acme.calendar.event"
    scope: "calendar"
  };

  // The resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // A one-line summary.
  string summary = 2 [(google.api.field_behavior) = REQUIRED];

  // When it starts.
  google.protobuf.Timestamp start_time = 3 [(google.api.field_behavior) = REQUIRED];

  // When it ends.
  google.protobuf.Timestamp end_time = 4 [(google.api.field_behavior) = OPTIONAL];

  // When it was created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it last changed.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The concurrency token.
  string etag = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was deleted (AIP-164).
  google.protobuf.Timestamp delete_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it goes for good (AIP-164).
  google.protobuf.Timestamp purge_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request for GetCalendar.
message GetCalendarRequest {
  // The calendar.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "calendar.acme.example/Calendar"
  ];
}

