// Holds and reservations, after freebusy's own: resources with a state
// machine, whose state changes are events, and the error reasons the service
// returns.

syntax = "proto3";

package acme.booking.v1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "service/v1/annotations.proto";

option go_package = "github.com/the-protobuf-project/service/examples/generated/go/acme/booking/v1;bookingv1";
option java_multiple_files = true;
option java_outer_classname = "BookingProto";
option java_package = "com.acme.booking.v1";

// Holds serves holds.
service Holds {
  option (google.api.default_host) = "booking.acme.example";

  // Gets a hold.
  rpc GetHold(GetHoldRequest) returns (Hold) {
    option (google.api.http) = {get: "/v1/{name=organizationalUnits/*/holds/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a site's holds.
  rpc ListHolds(ListHoldsRequest) returns (ListHoldsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizationalUnits/*}/holds"};
    option (google.api.method_signature) = "parent";
  }

  // Takes a hold.
  rpc CreateHold(CreateHoldRequest) returns (Hold) {
    option (google.api.http) = {
      post: "/v1/{parent=organizationalUnits/*}/holds"
      body: "hold"
    };
    option (google.api.method_signature) = "parent,hold,hold_id";
  }

  // Releases a hold (custom, AIP-136).
  rpc ReleaseHold(ReleaseHoldRequest) returns (Hold) {
    option (google.api.http) = {
      post: "/v1/{name=organizationalUnits/*/holds/*}:release"
      body: "*"
    };
  }
}

// Reservations serves reservations.
service Reservations {
  option (google.api.default_host) = "booking.acme.example";

  // Gets a reservation.
  rpc GetReservation(GetReservationRequest) returns (Reservation) {
    option (google.api.http) = {get: "/v1/{name=organizationalUnits/*/reservations/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists a site's reservations.
  rpc ListReservations(ListReservationsRequest) returns (ListReservationsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizationalUnits/*}/reservations"};
    option (google.api.method_signature) = "parent";
  }

  // Confirms a hold as a reservation: business logic, so custom.
  rpc CreateReservation(CreateReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      post: "/v1/{parent=organizationalUnits/*}/reservations"
      body: "reservation"
    };
    option (google.api.method_signature) = "parent,reservation,reservation_id";
    option (service.v1.method) = {custom: true};
  }

  // Updates who a reservation is for.
  rpc UpdateReservation(UpdateReservationRequest) returns (Reservation) {
    option (google.api.http) = {
      patch: "/v1/{reservation.name=organizationalUnits/*/reservations/*}"
      body: "reservation"
    };
    option (google.api.method_signature) = "reservation,update_mask";
  }
}

// A hold: resources taken for a while, until confirmed or released.
message Hold {
  option (google.api.resource) = {
    type: "booking.acme.example/Hold"
    pattern: "organizationalUnits/{organizational_unit}/holds/{hold}"
    singular: "hold"
    plural: "holds"
  };
  option (service.v1.event) = {
    type: "example.acme.hold"
    omit: [
      "created",
      "updated",
      "deleted"
    ]
    scope: "organizational_unit"
  };

  // Where a hold stands.
  enum State {
    // Unset.
    STATE_UNSPECIFIED = 0;
    // Holding its resources.
    STATE_ACTIVE = 1 [(service.v1.state_event) = {}];
    // Became a reservation.
    STATE_CONVERTED = 2 [(service.v1.state_event) = {}];
    // Let go.
    STATE_RELEASED = 3 [(service.v1.state_event) = {type: "example.acme.hold.let_go"}];
  }

  // The resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // How many resources it holds.
  int32 quantity = 2 [(google.api.field_behavior) = REQUIRED];

  // Where it stands.
  State state = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it last changed.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The concurrency token.
  string etag = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A reservation: a confirmed hold.
message Reservation {
  option (google.api.resource) = {
    type: "booking.acme.example/Reservation"
    pattern: "organizationalUnits/{organizational_unit}/reservations/{reservation}"
    singular: "reservation"
    plural: "reservations"
  };
  option (service.v1.event) = {scope: "organizational_unit"};

  // The resource name.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // The hold it was made from.
  string hold = 2 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference).type = "booking.acme.example/Hold"
  ];

  // Who it is for.
  string customer = 3 [(google.api.field_behavior) = OPTIONAL];

  // When it was created.
  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it last changed.
  google.protobuf.Timestamp update_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // The concurrency token.
  string etag = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it was deleted (AIP-164).
  google.protobuf.Timestamp delete_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When it goes for good (AIP-164).
  google.protobuf.Timestamp purge_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request for GetHold.
message GetHoldRequest {
  // The hold.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "booking.acme.example/Hold"
  ];
}

// Request for ListHolds.
message ListHoldsRequest {
  // The site.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "booking.acme.example/Hold"
  ];
  // The page size.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // The page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  // An AIP-160 filter.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response of ListHolds.
message ListHoldsResponse {
  // The page.
  repeated Hold holds = 1;
  // The next page's token.
  string next_page_token = 2;
}

// Request for CreateHold.
message CreateHoldRequest {
  // The site.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "booking.acme.example/Hold"
  ];
  // The hold.
  Hold hold = 2 [(google.api.field_behavior) = REQUIRED];
  // Its id; empty mints one.
  string hold_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request for ReleaseHold.
message ReleaseHoldRequest {
  // The hold.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "booking.acme.example/Hold"
  ];
}

// Request for GetReservation.
message GetReservationRequest {
  // The reservation.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "booking.acme.example/Reservation"
  ];
}

// Request for ListReservations.
message ListReservationsRequest {
  // The site.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "booking.acme.example/Reservation"
  ];
  // The page size.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  // The page token.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response of ListReservations.
message ListReservationsResponse {
  // The page.
  repeated Reservation reservations = 1;
  // The next page's token.
  string next_page_token = 2;
}

// Request for CreateReservation.
message CreateReservationRequest {
  // The site.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "booking.acme.example/Reservation"
  ];
  // The reservation.
  Reservation reservation = 2 [(google.api.field_behavior) = REQUIRED];
  // Its id.
  string reservation_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Request for UpdateReservation.
message UpdateReservationRequest {
  // The reservation.
  Reservation reservation = 1 [(google.api.field_behavior) = REQUIRED];
  // The fields to update.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// The reasons the booking service returns (AIP-193).
enum ErrorReason {
  option (service.v1.error_domain) = {domain: "booking.acme.example"};

  // Unset.
  ERROR_REASON_UNSPECIFIED = 0;
  // A hold that no longer holds anything.
  ERROR_REASON_HOLD_NOT_ACTIVE = 1 [(service.v1.error_reason) = {
    code: "FAILED_PRECONDITION"
    description: "The hold expired, was released, or became a reservation."
    fix: "Take a new hold."
    detail: DETAIL_KIND_PRECONDITION_FAILURE
  }];
  // Nothing left to hold.
  ERROR_REASON_CAPACITY_EXHAUSTED = 2 [(service.v1.error_reason) = {
    code: "FAILED_PRECONDITION"
    description: "Fewer resources are free for the window than were asked for."
    fix: "Ask for fewer, or another window."
    sentinel: true
  }];
  // A hold named in the wrong field.
  ERROR_REASON_HOLD_NOT_FOUND = 3 [(service.v1.error_reason) = {
    code: "INVALID_ARGUMENT"
    description: "The reservation's hold does not exist."
    fix: "Take a hold first with CreateHold."
    detail: DETAIL_KIND_BAD_REQUEST
  }];
  // Too much at once.
  ERROR_REASON_ENGINE_BUSY = 4 [(service.v1.error_reason) = {
    code: "RESOURCE_EXHAUSTED"
    description: "As many evaluations as the server runs at once were running."
    fix: "Retry after a short randomized backoff."
    retryable: true
    sentinel: true
  }];
}
